version: '3.3'

services:

  db:

    image: postgres:${POSTGRES_VERSION:-17}

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

  backend:

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"

    environment:
      - DATABASE_URL=${DATABASE_URL}

    dns:
      - 8.8.8.8
      - 1.1.1.1

    env_file:
      - .env

    depends_on:
      - db

    restart: always

  frontend:

    build:
      context: ./Monipro_web
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

    environment:
      - API_BASE_URL=${API_BASE_URL:-https://moni-pro.app.br}

    depends_on:
      - backend

    restart: always

volumes:
  pgdata:
