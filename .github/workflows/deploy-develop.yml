name: Deploy Develop (MoniPro Beta)

on:
  push:
    branches:
      - develop # Isso faz o script rodar SOMENTE quando houver push na branch develop

jobs:
  test:
    name: Gate de Qualidade (Testes)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://usuario:senha@localhost:5432/teste
      JWT_SECRET: segredo-de-ci

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes automatizados (Tarefa 7)
        run: npm test

      - name: Lint e formatação (ESLint + Prettier — Tarefa 10)
        run: npm run lint

  deploy:
    name: Deploy to Oracle Server
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "Iniciando atualização do ambiente de testes (Develop)..."
            cd ~/moni-pro-beta-develop

            # Atualiza o código pegando as novidades do GitHub
            git pull origin develop

            # Reconstrói as imagens antes de migrar: a migration roda com a imagem nova do backend
            docker-compose -p monipro-dev build

            # Aplica as migrations pendentes ANTES de trocar os containers (mesmo fluxo do
            # deploy.yml de produção). Sem isto, um campo novo no schema.prisma (ex.: data_fim)
            # chega ao código mas não ao banco, e as consultas do Prisma falham.
            docker-compose -p monipro-dev run --rm backend npx prisma migrate deploy

            # Só agora sobe os containers, já com o schema atualizado no banco
            docker-compose -p monipro-dev up -d
            
            echo "Deploy concluído com sucesso!"
