name: Deploy Main (MoniPro Produção)

on:
  push:
    branches:
      - main # Roda SOMENTE quando houver push ou merge aprovado na main

jobs:
  deploy:
    name: Deploy to Oracle Server (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "Iniciando atualização do ambiente de PRODUÇÃO (Main)..."
            
            # Entra na pasta do ambiente de produção
            cd ~/MoniPro-beta
            
            # Atualiza o código pegando as novidades do GitHub
            git pull origin main
            
            # Reconstrói as imagens e reinicia os containers de produção
            # (Note que aqui não usamos o -p monipro-dev)
            docker-compose up -d --build
            
            echo "Deploy de Produção concluído com sucesso!"
