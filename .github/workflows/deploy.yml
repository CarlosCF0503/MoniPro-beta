name: Deploy Main (MoniPro Produção)

on:
  push:
    branches:
      - main # Roda SOMENTE quando houver push ou merge aprovado na branch main

jobs:
  test:
    name: Gate de Qualidade (Testes)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://usuario:senha@localhost:5432/teste
      JWT_SECRET: segredo-de-ci

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes automatizados (Tarefa 7)
        run: npm test

      - name: Lint e formatação (ESLint + Prettier — Tarefa 10)
        run: npm run lint

  deploy:
    name: Deploy to Oracle Server (Production)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Executar comandos via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "Iniciando atualização do ambiente de PRODUÇÃO (Main)..."
            cd ~/moni-pro-beta

            # Sincroniza com o GitHub, descartando qualquer estado local divergente
            git fetch origin main
            git reset --hard origin/main

            # 1) Reconstrói as imagens de TODOS os serviços (sem subir ainda) — a do
            #    backend precisa estar pronta para rodar a migration com as mesmas
            #    dependências do app. O frontend também precisa ser reconstruído: o
            #    "up -d" do passo 4 não faz build, então sem isto o Nginx de produção
            #    continuaria servindo a imagem antiga do Monipro_web/.
            docker-compose build

            # 2) Estado das migrations, só para o registro do deploy (não altera nada).
            #    O "migrate status" sai com erro sempre que há migration pendente, ou seja,
            #    em todo release que traz uma migration nova. Com o "set -e" ele barrava o
            #    deploy antes do passo 3, que é justamente o que aplica as pendentes
            #    (aconteceu no #64, em 08/11/2026). Por isso o resultado não interrompe.
            docker-compose run --rm backend npx prisma migrate status || echo "migrate status: há migrations pendentes ou divergentes (ver acima); o passo 3 aplica as pendentes."

            # 3) Aplica as migrations pendentes do Prisma ANTES de trocar os containers,
            #    usando --rm para rodar num container descartável com o mesmo ambiente/rede
            #    já definidos no serviço "backend" (DATABASE_URL vem do .env via env_file).
            #    É este passo que barra o deploy (set -e) se o banco recusar a conexão (TLS,
            #    senha) ou se uma migration falhar; os containers em produção não são trocados.
            docker-compose run --rm backend npx prisma migrate deploy

            # 4) Só agora sobe os containers, já com o schema atualizado no banco
            docker-compose up -d

            echo "Deploy de Produção concluído com sucesso!"
