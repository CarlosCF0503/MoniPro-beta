# R1 (Fase 03): pilha completa para os testes de ponta a ponta (Playwright, pasta e2e/).
# Tudo é descartável e roda só na máquina ou no runner do CI; nada aponta para hml ou prod.
#
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#   npm run test:e2e
#   docker compose -f docker-compose.e2e.yml down -v
#
# Abre em http://localhost:8088 (E2E_PORTA). As senhas abaixo valem só para esta pilha.

name: monipro-e2e

services:
  certs:
    image: postgres:17
    entrypoint: ['sh', '/gerar-certs.sh']
    volumes:
      - ./e2e/pilha/gerar-certs.sh:/gerar-certs.sh:ro
      - certs:/certs

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=monipro
      - POSTGRES_PASSWORD=e2e-somente-local # pragma: allowlist secret
      - POSTGRES_DB=monipro_e2e
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    volumes:
      - certs:/certs:ro
    # Exposta só na máquina: os testes usam o banco para voltar o horário de uma vaga (CT-11)
    ports:
      - '127.0.0.1:${E2E_PORTA_DB:-5435}:5432'
    depends_on:
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monipro -d monipro_e2e']
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrações e seed fictício, uma vez, antes do backend (como no deploy de hml)
  preparar:
    build:
      context: .
      dockerfile: Dockerfile
    environment: &ambiente-backend
      DATABASE_URL: postgres://monipro:e2e-somente-local@db:5432/monipro_e2e # pragma: allowlist secret
      JWT_SECRET: segredo-e2e-somente-local # pragma: allowlist secret
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:${E2E_PORTA:-8088}
      LIMITE_TENTATIVAS_AUTH: '1000'
      LIMITE_REQUISICOES_MINUTO: '10000'
      SEED_AMBIENTE: local
      SEED_SENHA: senhaFicticiaE2e1 # pragma: allowlist secret
      SEED_IGNORAR_USUARIOS_REAIS: sim
    entrypoint: ['sh', '-c']
    command:
      - export DB_CA_CERT="$$(cat /certs/ca.crt)" && npx prisma migrate deploy && node prisma/seed.js
    volumes:
      - certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *ambiente-backend
    entrypoint: ['sh', '-c']
    command:
      - export DB_CA_CERT="$$(cat /certs/ca.crt)" && exec node src/server.js
    volumes:
      - certs:/certs:ro
    depends_on:
      preparar:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/saude > /dev/null || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./Monipro_web
      dockerfile: Dockerfile
    environment:
      - API_BASE_URL=http://localhost:${E2E_PORTA:-8088}

  gateway:
    image: nginx:alpine
    volumes:
      - ./e2e/pilha/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:${E2E_PORTA:-8088}:80'
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  certs:
