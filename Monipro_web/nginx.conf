server {

    listen 80;

    server_name moni-pro.app.br www.moni-pro.app.br;

    # R8: não expõe a versão do Nginx no cabeçalho Server nem nas páginas de erro
    server_tokens off;

    # R8: cabeçalhos de segurança das páginas do frontend (a API já os envia via helmet).
    # "always" inclui também as respostas de erro. Nenhum bloco location abaixo usa
    # add_header, então todos herdam estes.
    # CSP: tudo vem do próprio domínio; style-src precisa de 'unsafe-inline' porque HTML e
    # JS usam atributos style=; connect-src lista os dois domínios da API (prod e dev).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://moni-pro.app.br https://dev.moni-pro.app.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {

        root /usr/share/nginx/html;

        index index.html index.htm;

        try_files $uri $uri/ /index.html;

    }



    # Se a sua API for chamada pelo mesmo domínio no futuro, podemos redirecionar aqui

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {

        root /usr/share/nginx/html;

    }

}
