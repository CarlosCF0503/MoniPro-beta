<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/fontes.css">
    <link rel="stylesheet" href="CSS/legal.css">
    <link rel="stylesheet" href="CSS/base.css" />
    <link rel="icon" href="IMG/MoniPro-mini.png" />

    <!-- CSS Exclusivo do Monitor -->
    <link rel="stylesheet" href="CSS/perfil_monitor.css" />

    <title>Meu perfil - MoniPro</title>
  </head>
  <body>
    <!-- Header, menu lateral e aviso de sair: iguais às outras telas (controlados por base.js) -->
    <header>
      <div class="logo">
        <a href="base.html"
          ><img src="IMG/MoniPro_logo-menor.png" alt="Logo MoniPro"
        /></a>
      </div>
      <div class="header-actions">
        <div
          class="perfil-link header-icon"
          role="button"
          tabindex="0"
          aria-label="Ver perfil do usuário"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#071E3D"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
          </svg>
        </div>
        <div
          id="menu"
          class="header-icon"
          role="button"
          tabindex="0"
          aria-label="Abrir menu de navegação"
          aria-expanded="false"
          aria-controls="menuLateral"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#071E3D"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </div>
      </div>
    </header>

    <div id="overlay"></div>

    <nav id="menuLateral" aria-label="Menu principal">
      <div class="logo_fechar">
        <img src="IMG/Logo.png" alt="Logo MoniPro" />
        <div
          id="menu_fechar"
          role="button"
          tabindex="0"
          aria-label="Fechar menu"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </div>
      </div>
      <div
        class="perfil-link item"
        role="button"
        tabindex="0"
        aria-label="Ir para Perfil"
      >
        <div class="icone">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
          </svg>
        </div>
        <p>Perfil</p>
      </div>
      <div
        class="item monitoria-link"
        role="button"
        tabindex="0"
        aria-label="Ir para Monitoria"
      >
        <div class="icone">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </svg>
        </div>
        <p>Monitoria</p>
      </div>
      <div
        id="sair"
        class="item"
        role="button"
        tabindex="0"
        aria-label="Sair do sistema"
      >
        <div class="icone">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </div>
        <p>Sair</p>
      </div>
    </nav>

    <!-- Modais de sair -->
    <div id="aviso_sair">
      <div class="icone_sair">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="56"
          height="56"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#F59E0B"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
          />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        <p>Tem certeza que quer sair?</p>
      </div>
      <div class="areaSim"><button id="btnSim">Sair</button></div>
      <div class="areaNao"><button id="btnNao">Voltar</button></div>
    </div>

    <!-- ==========================================
         PERFIL DO MONITOR
         Montagem decidida pelo time: >= 700px abas + coluna lateral (opção A);
         < 700px abas no rodapé: Vagas, Horas, Perfil (opção C).
         Conteúdo montado por JS/perfil/monitor.js.
         ========================================== -->
    <main class="pagina-perfil" id="perfil-app" aria-busy="true">
      <p class="pp-carregando">Carregando seu perfil…</p>
    </main>
    <footer class="rodape-legal acima-da-barra"><a href="privacidade.html">Aviso de Privacidade</a></footer>

    <!-- Finalizar monitoria: término numa caixa clicável com lista curta (mesmo padrão de Marcar Monitoria) -->
    <dialog class="pp-dlg" id="dlg-finalizar" aria-labelledby="fin-titulo">
      <form method="dialog" id="fin-form" novalidate>
        <div>
          <h2 id="fin-titulo">Finalizar monitoria</h2>
          <p class="pp-sub" id="fin-sub"></p>
        </div>
        <div class="pp-campo">
          <span class="pp-rotulo">Início</span>
          <div class="pp-leitura" id="fin-inicio"></div>
        </div>
        <div class="pp-campo">
          <span class="pp-rotulo" id="fin-fim-rotulo">Horário de término</span>
          <div class="hora">
            <button
              type="button"
              id="fin-fim"
              class="hora-btn"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="fin-lista"
              aria-labelledby="fin-fim-rotulo fin-fim-valor"
              aria-describedby="fin-erro fin-duracao"
            >
              <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><polyline points="12 7 12 12 15 14" /></svg>
              <span class="valor sem-valor" id="fin-fim-valor">Escolher</span>
              <span class="seta"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9" /></svg></span>
            </button>
            <ul class="hora-lista" id="fin-lista" role="listbox" aria-labelledby="fin-fim-rotulo" tabindex="-1" hidden></ul>
          </div>
          <div class="pp-atalhos" role="group" aria-label="Durações comuns">
            <button type="button" data-minutos="60">1h</button>
            <button type="button" data-minutos="90">1h30</button>
            <button type="button" data-minutos="120">2h</button>
          </div>
          <p class="pp-duracao" id="fin-duracao">Escolha o término para ver a duração.</p>
          <p class="pp-erro" id="fin-erro" role="alert"></p>
        </div>
        <div class="pp-acoes">
          <button type="button" class="pp-btn pp-btn-sec" data-fechar>Voltar</button>
          <button type="submit" class="pp-btn pp-btn-pri" id="fin-confirmar">Finalizar monitoria</button>
        </div>
      </form>
    </dialog>

    <!-- Cancelar vaga (só aparece para vagas com 24h ou mais até o início, RN-001) -->
    <dialog class="pp-dlg" id="dlg-cancelar" aria-labelledby="can-titulo">
      <form method="dialog" id="can-form">
        <div>
          <h2 id="can-titulo">Cancelar esta vaga?</h2>
          <p class="pp-sub" id="can-sub"></p>
        </div>
        <p class="pp-aviso" id="can-aviso"></p>
        <div class="pp-acoes">
          <button type="button" class="pp-btn pp-btn-sec" data-fechar>Manter vaga</button>
          <button type="submit" class="pp-btn pp-btn-perigo" id="can-confirmar">Cancelar vaga</button>
        </div>
      </form>
    </dialog>

    <!-- Detalhes da vaga (celular): abre ao tocar numa linha da lista -->
    <dialog class="pp-dlg" id="dlg-detalhes" aria-labelledby="det-titulo">
      <div class="pp-dlg-corpo">
        <div class="pp-dlg-topo">
          <h2 id="det-titulo"></h2>
          <button type="button" class="pp-icone-btn" data-fechar aria-label="Fechar">
            <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div id="det-corpo" class="pp-det"></div>
      </div>
    </dialog>

    <div id="toast-container"></div>
    <script src="JS/config.js"></script>
    <script src="JS/api.js" defer></script>
    <script src="JS/toast.js" defer></script>
    <script src="JS/base.js" defer></script>
    <script src="JS/perfil/dados.js" defer></script>
    <script src="JS/perfil/excluir_conta.js" defer></script>
    <script src="JS/perfil/monitor.js" defer></script>
  </body>
</html>
