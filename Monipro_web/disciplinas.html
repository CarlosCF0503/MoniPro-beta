<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disciplinas - MoniPro</title>
    <link rel="stylesheet" href="CSS/base.css">
    <link rel="stylesheet" href="CSS/disciplinas.css">
</head>
<body>
    
    <header>
        <div class="logo">
            <a href="base.html"><img src="IMG/MoniPro_logo-menor.png" alt="Logo MoniPro"></a>
        </div>
        <div class="header-actions">
            <div class="header-icon perfil-link">
                <img src="IMG/Icone_Perfil.png" alt="Ver perfil">
            </div>
            <div id="menu" class="header-icon">
                <img src="IMG/Menu_hamburguer.png" alt="Menu">
            </div>
        </div>
    </header>

    <div id="overlay"></div>

    <nav id="menuLateral">
        <div class="logo_fechar">
            <img src="IMG/Logo.png" alt="Logo MoniPro">
            <div id="menu_fechar"><img src="IMG/Icone_menu_fechar.png" alt="Fechar menu"></div>
        </div>
        <div class="item perfil-link">
            <div class="icone"><img src="IMG/Icone_perfil_menu.png" alt="Perfil"></div>
            <p>Perfil</p>
        </div>
        <div class="item monitoria-link">
            <div class="icone"><img src="IMG/logo_monitoria.png" alt="Monitoria"></div>
            <p>Monitoria</p>
        </div>
        <div class="item disciplinas-link">
            <div class="icone"><img src="IMG/Icone_livro.png" alt="📚" onerror="this.style.display='none'; this.parentNode.innerHTML='📚'"></div>
            <p>Disciplinas</p>
        </div>
        <div id="sair" class="item">
            <div class="icone"><img src="IMG/Icone_sair.png" alt="Sair"></div>
            <p>Sair</p>
        </div>
    </nav>

    <div id="aviso_sair">
        <div class="icone_sair">
            <img src="IMG/Icone_aviso.png" alt="Ícone de aviso">
            <p>Tem certeza que quer sair?</p>
        </div>
        <div class="areaSim"><button id="btnSim">Sim</button></div>
        <div class="areaNao"><button id="btnNao">Não</button></div>
    </div>

    <main class="container">
        
        <div class="cabecalho-disciplinas">
            <h1>Disciplinas Cadastradas</h1>
            <button id="btnNovaDisciplina" class="btn-primario" style="display: none;">+ Nova Disciplina</button>
        </div>

        <div id="listaDisciplinas" class="grid-disciplinas">
            <p>Carregando disciplinas...</p>
        </div>
    </main>

    <div id="modalDisciplina" class="fundo-modal">
        <div class="caixa-modal">
            <h2>Cadastrar Disciplina</h2>
            
            <label for="nomeDisciplina">Nome da Disciplina:</label>
            <input type="text" id="nomeDisciplina" placeholder="Ex: Cálculo 1" />
            
            <div class="botoes-modal">
                <button id="btnCancelar" class="btn-secundario">Cancelar</button>
                <button id="btnSalvar" class="btn-primario">Salvar</button>
            </div>
        </div>
    </div>

    <script src="JS/api.js"></script> 
    <script src="JS/base.js"></script>
    <script src="JS/disciplinas.js"></script>
</body>
</html>
