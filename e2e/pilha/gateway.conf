# R1 (E2E): faz o papel do Nginx do servidor (scripts/gerar-nginx.sh): frontend e API na
# mesma origem. As rotas do backend vão para o container backend, o resto para o frontend.
# Sem TLS: o navegador trata http://localhost como contexto seguro, então o cookie Secure
# da sessão funciona como em produção.
server {
    listen 80;
    server_tokens off;

    location ~ ^/(agendamentos|auth|disciplinas|monitorias|perfil|saude|teste)(/|$) {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
